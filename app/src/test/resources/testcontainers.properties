# Project-level Testcontainers config. Shipped with the repo so every
# contributor's machine works without a user-level ~/.testcontainers.properties.
#
# api.version: docker-java defaults to v1.32 in URL paths, which Docker Desktop
# 29+ rejects with HTTP 400. Bumping here forces v1.43.
#
# ryuk.disabled: Ryuk is the Testcontainers reaper container. On Docker Desktop
# for macOS the Linux VM cannot mount the host docker.sock path, so the Ryuk
# container fails to start. Disabling it skips the reaper. The trade-off is no
# automatic cleanup if the test JVM crashes mid-run, which is acceptable for
# a tutorial repo.

api.version=1.43
ryuk.disabled=true
