spring:
  application:
    name: hikaricp-demo

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:6432/app?prepareThreshold=0}
    username: ${SPRING_DATASOURCE_USERNAME:app}
    password: ${SPRING_DATASOURCE_PASSWORD:app}
    hikari:
      pool-name: app-hikari
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MAX_POOL_SIZE:10}
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 1800000
      keepalive-time: 60000
      leak-detection-threshold: 5000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate.jdbc.batch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration

pricing:
  delay-ms: ${PRICING_DELAY_MS:2000}

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info
  metrics:
    distribution:
      percentiles-histogram:
        hikaricp.connections.usage: true
        hikaricp.connections.acquire: true
      percentiles:
        hikaricp.connections.usage: 0.5, 0.95, 0.99
        hikaricp.connections.acquire: 0.5, 0.95, 0.99

server:
  port: 8080
